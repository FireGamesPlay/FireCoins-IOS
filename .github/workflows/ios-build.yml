name: iOS build

on:
  push:
    branches:
      - v2-development
    paths:
      - "App/**"
      - "Core/**"
      - "Features/**"
      - "FireCoins.xcodeproj/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches:
      - main

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Fire Coins for iOS Simulator
        run: |
          xcodebuild \
            -project FireCoins.xcodeproj \
            -scheme FireCoins \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

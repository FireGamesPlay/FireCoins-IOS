name: Build signed IPA
on:
  push:
    branches:
      - v2-development
    paths:
      - "App/**"
      - "Core/**"
      - "Features/**"
      - "Assets.xcassets/**"
      - "FireCoins.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install signing certificate and provisioning profile
        id: signing
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" || (echo "Missing IOS_P12_BASE64 secret" && exit 1)
          test -n "$PROFILE_BASE64" || (echo "Missing IOS_PROVISIONING_PROFILE_BASE64 secret" && exit 1)
          test -n "$TEAM_ID" || (echo "Missing APPLE_TEAM_ID secret" && exit 1)

          CERT_PATH="$RUNNER_TEMP/firecoins-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/firecoins.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/firecoins-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Checking P12 structure..."
          openssl pkcs12 -in "$CERT_PATH" -passin env:P12_PASSWORD -noout
          echo "P12 validation successful"
          umask 077

          # Extract and verify the certificate/private-key pair without logging
          # either object. Re-exporting normalizes older PKCS#12 encryption.
          CERT_PEM="$RUNNER_TEMP/firecoins-cert.pem"
          KEY_PEM="$RUNNER_TEMP/firecoins-key.pem"
          NORMALIZED_P12="$RUNNER_TEMP/firecoins-normalized.p12"
          openssl pkcs12 -in "$CERT_PATH" -passin env:P12_PASSWORD -clcerts -nokeys -out "$CERT_PEM"
          openssl pkcs12 -in "$CERT_PATH" -passin env:P12_PASSWORD -nocerts -nodes -out "$KEY_PEM"
          chmod 600 "$CERT_PEM" "$KEY_PEM"
          if ! grep -Eq 'BEGIN ([A-Z0-9]+ )?PRIVATE KEY' "$KEY_PEM"; then
            echo "IOS_P12_BASE64 does not contain a private signing key. Export the certificate together with its private key."
            exit 1
          fi
          CERT_PUBLIC_KEY=$(openssl x509 -in "$CERT_PEM" -pubkey -noout | openssl pkey -pubin -outform DER | shasum -a 256 | awk '{print $1}')
          KEY_PUBLIC_KEY=$(openssl pkey -in "$KEY_PEM" -pubout -outform DER | shasum -a 256 | awk '{print $1}')
          if [ "$CERT_PUBLIC_KEY" != "$KEY_PUBLIC_KEY" ]; then
            echo "The certificate and private key in IOS_P12_BASE64 do not match."
            exit 1
          fi
          openssl pkcs12 -export -in "$CERT_PEM" -inkey "$KEY_PEM" -out "$NORMALIZED_P12" -passout pass:"$KEYCHAIN_PASSWORD" -name FireCoins
          chmod 600 "$NORMALIZED_P12"

          security import "$NORMALIZED_P12" \
            -P "$KEYCHAIN_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITY_COUNT=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" 2>/dev/null | awk '/valid identities found/{print $1}')
          if [ "${IDENTITY_COUNT:-0}" -lt 1 ]; then
            echo "No valid code-signing identity with a private key was found in the imported certificate."
            exit 1
          fi
          echo "Valid code-signing identities available: $IDENTITY_COUNT"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          SIGNING_CERT_SHA1=$(openssl x509 -in "$CERT_PEM" -noout -fingerprint -sha1 | sed 's/.*=//;s/://g')

          export PROFILE_PLIST CERT_PEM TEAM_ID
          python3 - <<'PY'
          import hashlib, os, plistlib, subprocess, sys
          with open(os.environ["PROFILE_PLIST"], "rb") as stream:
              profile = plistlib.load(stream)
          team_ids = profile.get("TeamIdentifier", [])
          if os.environ["TEAM_ID"] not in team_ids:
              raise SystemExit("The provisioning profile belongs to a different Apple team.")
          cert_der = subprocess.check_output([
              "openssl", "x509", "-in", os.environ["CERT_PEM"], "-outform", "DER"
          ])
          cert_hash = hashlib.sha256(cert_der).digest()
          profile_hashes = {
              hashlib.sha256(item).digest()
              for item in profile.get("DeveloperCertificates", [])
          }
          if cert_hash not in profile_hashes:
              raise SystemExit("The P12 signing certificate is not included in this provisioning profile.")
          entitlements = profile.get("Entitlements", {})
          if entitlements.get("get-task-allow") is True:
              method = "development"
          elif profile.get("ProvisionedDevices"):
              method = "ad-hoc"
          else:
              method = "app-store-connect"
          if method == "development":
              raise SystemExit("A Development provisioning profile cannot be used for a release IPA. Configure an Ad Hoc or App Store Connect distribution profile.")
          print("Provisioning profile matches the P12 certificate.")
          print("Detected release provisioning profile type:", method)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("export_method=" + method + "\n")
          PY

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "signing_cert_sha1=$SIGNING_CERT_SHA1" >> "$GITHUB_OUTPUT"

      - name: Archive iOS app
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          SIGNING_CERT_SHA1: ${{ steps.signing.outputs.signing_cert_sha1 }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project FireCoins.xcodeproj \
            -scheme FireCoins \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FireCoins.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_CERT_SHA1" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            archive

      - name: Export IPA
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          SIGNING_CERT_SHA1: ${{ steps.signing.outputs.signing_cert_sha1 }}
          EXPORT_METHOD: ${{ steps.signing.outputs.export_method }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": os.environ["EXPORT_METHOD"],
              "teamID": os.environ["TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": os.environ["SIGNING_CERT_SHA1"],
              "provisioningProfiles": {
                  "ru.firedev.firecoins": os.environ["PROFILE_NAME"]
              },
              "destination": "export"
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as file:
              plistlib.dump(options, file)
          PY

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FireCoins.xcarchive" \
            -exportPath "$RUNNER_TEMP/FireCoins-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireCoins-IPA
          path: ${{ runner.temp }}/FireCoins-export/*.ipa
          if-no-files-found: error
          retention-days: 14

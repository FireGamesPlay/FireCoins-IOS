name: Build signed IPA
# One-time signed build validation trigger; normal builds remain manual.

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: Provisioning profile type
        required: true
        type: choice
        default: development
        options:
          - development
          - ad-hoc
          - app-store-connect
      signing_identity:
        description: Certificate identity contained in the P12
        required: true
        type: choice
        default: Apple Development
        options:
          - Apple Development
          - Apple Distribution
  push:
    branches:
      - v2-development
    paths:
      - ".github/workflows/build-ipa.yml"

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[signed-build]')
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install signing certificate and provisioning profile
        id: signing
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ inputs.signing_identity || 'Apple Development' }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" || (echo "Missing IOS_P12_BASE64 secret" && exit 1)
          test -n "$PROFILE_BASE64" || (echo "Missing IOS_PROVISIONING_PROFILE_BASE64 secret" && exit 1)
          test -n "$TEAM_ID" || (echo "Missing APPLE_TEAM_ID secret" && exit 1)

          CERT_PATH="$RUNNER_TEMP/firecoins-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/firecoins.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/firecoins-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          echo "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "Checking P12 structure..."
          openssl pkcs12 -in "$CERT_PATH" -passin env:P12_PASSWORD -noout
          echo "P12 validation successful"
          umask 077

          openssl pkcs12 \
            -in "$CERT_PATH" \
            -passin env:P12_PASSWORD \
            -nodes \
            -out "$RUNNER_TEMP/firecoins-signing.pem"

          chmod 600 "$RUNNER_TEMP/firecoins-signing.pem"

          security import "$RUNNER_TEMP/firecoins-signing.pem" \
            -A \
            -f pemseq \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "signing_identity=$SIGNING_IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Archive iOS app
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.signing_identity }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project FireCoins.xcodeproj \
            -scheme FireCoins \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FireCoins.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export IPA
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
          TEAM_ID: ${{ steps.signing.outputs.team_id }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.signing_identity }}
          EXPORT_METHOD: ${{ inputs.export_method || 'development' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib
          options = {
              "method": os.environ["EXPORT_METHOD"],
              "teamID": os.environ["TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": os.environ["SIGNING_IDENTITY"],
              "provisioningProfiles": {
                  "app.ursamajor9973.elephant5884": os.environ["PROFILE_NAME"]
              },
              "destination": "export"
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "ExportOptions.plist"), "wb") as file:
              plistlib.dump(options, file)
          PY

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FireCoins.xcarchive" \
            -exportPath "$RUNNER_TEMP/FireCoins-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireCoins-IPA
          path: ${{ runner.temp }}/FireCoins-export/*.ipa
          if-no-files-found: error
          retention-days: 14

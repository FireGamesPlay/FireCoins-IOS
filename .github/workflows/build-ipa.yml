name: Build signed IPA

on:
  push:
    branches:
      - v2-development
    paths:
      - "App/**"
      - "Core/**"
      - "Features/**"
      - "Assets.xcassets/**"
      - "FireCoins.xcodeproj/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and re-sign Fire Coins IPA
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: app.firecoins

    steps:
      - name: Guard release branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/v2-development" ]]; then
            echo "::error::Release IPA builds must run from v2-development. Selected ref: $GITHUB_REF"
            exit 1
          fi
          echo "Building source from v2-development at $GITHUB_SHA"

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: v2-development

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Prepare signing files
        shell: bash
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64" || (echo "::error::Missing IOS_P12_BASE64 secret" && exit 1)
          test -n "$PROFILE_BASE64" || (echo "::error::Missing IOS_PROVISIONING_PROFILE_BASE64 secret" && exit 1)
          test -n "$TEAM_ID" || (echo "::error::Missing APPLE_TEAM_ID secret" && exit 1)

          umask 077
          CERT_PATH="$RUNNER_TEMP/firecoins-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/firecoins.mobileprovision"
          CERT_PEM="$RUNNER_TEMP/firecoins-cert.pem"
          KEY_PEM="$RUNNER_TEMP/firecoins-key.pem"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"

          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT_PATH"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          openssl pkcs12 -in "$CERT_PATH" -passin env:P12_PASSWORD -noout
          openssl pkcs12 -in "$CERT_PATH" -passin env:P12_PASSWORD -clcerts -nokeys -out "$CERT_PEM"
          openssl pkcs12 -in "$CERT_PATH" -passin env:P12_PASSWORD -nocerts -nodes -out "$KEY_PEM"
          chmod 600 "$CERT_PATH" "$PROFILE_PATH" "$CERT_PEM" "$KEY_PEM"

          CERT_PUBLIC_KEY=$(openssl x509 -in "$CERT_PEM" -pubkey -noout | openssl pkey -pubin -outform DER | shasum -a 256 | awk '{print $1}')
          KEY_PUBLIC_KEY=$(openssl pkey -in "$KEY_PEM" -pubout -outform DER | shasum -a 256 | awk '{print $1}')
          if [[ "$CERT_PUBLIC_KEY" != "$KEY_PUBLIC_KEY" ]]; then
            echo "::error::The P12 certificate and private key do not match."
            exit 1
          fi

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          export PROFILE_PLIST CERT_PEM TEAM_ID
          python3 - <<'PY'
          import hashlib
          import os
          import plistlib
          import subprocess

          with open(os.environ["PROFILE_PLIST"], "rb") as stream:
              profile = plistlib.load(stream)

          if os.environ["TEAM_ID"] not in profile.get("TeamIdentifier", []):
              raise SystemExit("The provisioning profile belongs to a different Apple team.")

          cert_der = subprocess.check_output([
              "openssl", "x509", "-in", os.environ["CERT_PEM"], "-outform", "DER"
          ])
          cert_hash = hashlib.sha256(cert_der).digest()
          profile_hashes = {
              hashlib.sha256(item).digest()
              for item in profile.get("DeveloperCertificates", [])
          }
          if cert_hash not in profile_hashes:
              raise SystemExit("The P12 signing certificate is not included in the provisioning profile.")

          # Deliberately do not compare the profile's App ID to app.firecoins here.
          # The app is built unsigned and its final Bundle ID is applied by zsign.
          print("P12/private-key pair is valid.")
          print("Signing certificate belongs to the supplied provisioning profile.")
          print("Provisioning profile accepted for the post-build signing stage.")
          PY

      - name: Build unsigned iOS app
        shell: bash
        env:
          FIREBASE_APP_ID: ${{ secrets.IOS_FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.IOS_FIREBASE_SENDER_ID }}
          FIREBASE_API_KEY: ${{ secrets.IOS_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          DERIVED_DATA="$RUNNER_TEMP/FireCoins-DerivedData"

          xcodebuild \
            -project FireCoins.xcodeproj \
            -scheme FireCoins \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=2.1.3 \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            FIREBASE_APP_ID="${FIREBASE_APP_ID:-}" \
            FIREBASE_SENDER_ID="${FIREBASE_SENDER_ID:-}" \
            FIREBASE_API_KEY="${FIREBASE_API_KEY:-}" \
            FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID:-}" \
            build

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/FireCoins.app"
          test -d "$APP_PATH" || (echo "::error::Unsigned FireCoins.app was not produced." && exit 1)
          test -s "$APP_PATH/Assets.car" || (echo "::error::Compiled asset catalog is missing; app icon may not be packaged." && exit 1)

          BUILT_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          if [[ "$BUILT_BUNDLE_ID" != "$APP_BUNDLE_ID" ]]; then
            echo "::error::Unexpected Bundle ID in unsigned app: $BUILT_BUNDLE_ID"
            exit 1
          fi
          echo "Unsigned app built: Bundle ID=$BUILT_BUNDLE_ID"
          echo "App version: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"

          STAGE="$RUNNER_TEMP/FireCoins-IPARoot"
          mkdir -p "$STAGE/Payload"
          ditto "$APP_PATH" "$STAGE/Payload/FireCoins.app"
          (cd "$STAGE" && /usr/bin/zip -qry "$RUNNER_TEMP/FireCoins-unsigned.ipa" Payload)
          test -s "$RUNNER_TEMP/FireCoins-unsigned.ipa"

      - name: Build zsign
        shell: bash
        run: |
          set -euo pipefail
          brew install openssl@3 pkg-config

          git clone --depth 1 --branch v1.1.3 https://github.com/zhlynn/zsign.git "$RUNNER_TEMP/zsign"
          export PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          make -C "$RUNNER_TEMP/zsign/build/macos" -j2
          test -x "$RUNNER_TEMP/zsign/bin/zsign"
          "$RUNNER_TEMP/zsign/bin/zsign" --version

      - name: Re-sign IPA with zsign
        shell: bash
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/firecoins-signing.p12"
          PROFILE_PATH="$RUNNER_TEMP/firecoins.mobileprovision"
          UNSIGNED_IPA="$RUNNER_TEMP/FireCoins-unsigned.ipa"
          SIGNED_IPA="$RUNNER_TEMP/FireCoins.ipa"
          ZSIGN="$RUNNER_TEMP/zsign/bin/zsign"

          "$ZSIGN"             -f             -k "$CERT_PATH"             -p "$P12_PASSWORD"             -m "$PROFILE_PATH"             -b "$APP_BUNDLE_ID"             -o "$SIGNED_IPA"             "$UNSIGNED_IPA"

          test -s "$SIGNED_IPA" || (echo "::error::zsign did not produce FireCoins.ipa." && exit 1)

      - name: Verify signed IPA contents
        shell: bash
        run: |
          set -euo pipefail
          SIGNED_IPA="$RUNNER_TEMP/FireCoins.ipa"
          VERIFY_DIR="$RUNNER_TEMP/FireCoins-verify"
          mkdir -p "$VERIFY_DIR"
          /usr/bin/ditto -x -k "$SIGNED_IPA" "$VERIFY_DIR"

          APP_PATH="$VERIFY_DIR/Payload/FireCoins.app"
          test -d "$APP_PATH" || (echo "::error::Signed IPA does not contain Payload/FireCoins.app." && exit 1)
          test -s "$APP_PATH/Assets.car" || (echo "::error::Signed IPA is missing its compiled app icon/assets." && exit 1)
          test -s "$APP_PATH/embedded.mobileprovision" || (echo "::error::Signed IPA is missing embedded.mobileprovision." && exit 1)
          test -s "$APP_PATH/_CodeSignature/CodeResources" || (echo "::error::Signed app is missing CodeResources." && exit 1)

          FINAL_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          FINAL_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")
          FINAL_BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")

          if [[ "$FINAL_BUNDLE_ID" != "$APP_BUNDLE_ID" ]]; then
            echo "::error::Final IPA Bundle ID mismatch: $FINAL_BUNDLE_ID"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "Verified IPA: Bundle ID=$FINAL_BUNDLE_ID, version=$FINAL_VERSION, build=$FINAL_BUILD"
          shasum -a 256 "$SIGNED_IPA"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: FireCoins-IPA
          path: ${{ runner.temp }}/FireCoins.ipa
          if-no-files-found: error
          retention-days: 14
